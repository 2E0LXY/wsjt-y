name: Linux (Debian) build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    # Build inside a Debian 13 (trixie) container so dpkg-shlibdeps resolves
    # dependencies against trixie's actual library versions. Building on the
    # host ubuntu-22.04 pins Ubuntu-numbered deps that fail to install on
    # Debian 13.
    container: debian:trixie
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates file \
            gfortran \
            qtbase5-dev qt5-qmake qttools5-dev qttools5-dev-tools \
            qtmultimedia5-dev libqt5multimedia5-plugins \
            libqt5serialport5-dev libqt5websockets5-dev \
            libqt5sql5-sqlite libqt5svg5-dev \
            libfftw3-dev \
            libboost-log-dev libboost-thread-dev \
            libhamlib-dev libhamlib-utils \
            libusb-1.0-0-dev libudev-dev \
            portaudio19-dev \
            dpkg-dev

      - name: Configure (CMake)
        run: |
          mkdir build && cd build
          VERSION_Z_OVERRIDE=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION_Z_OVERRIDE="${GITHUB_REF_NAME#v}"; fi
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_GENERATE_DOCS=OFF \
            -DVERSION_Z_OVERRIDE="${VERSION_Z_OVERRIDE}" \
            ..

      - name: Build
        run: |
          cd build
          ninja -j$(nproc)

      - name: Package (.deb)
        run: |
          cd build
          cpack -G DEB
          for f in *.deb; do
            mv "$f" "${f%_amd64.deb}_trixie_amd64.deb"
          done
          ls -lh *.deb
          echo "--- resolved dependencies ---"
          dpkg-deb -f *.deb Depends

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsjt-y-linux-deb
          path: build/*.deb
          retention-days: 30

      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
